<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      width: 280px;
      padding: 16px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .limit {
      margin-bottom: 14px;
    }

    .limit-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }

    .limit-label {
      font-size: 13px;
      color: #ccc;
    }

    .limit-pct {
      font-size: 14px;
      font-weight: 600;
    }

    .bar-track {
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .reset-time {
      font-size: 11px;
      color: #555;
      margin-top: 3px;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 14px 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fetched-time {
      font-size: 11px;
      color: #444;
    }

    button {
      font-size: 11px;
      color: #666;
      background: none;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }

    button:hover { color: #aaa; border-color: #555; }

    .error {
      font-size: 13px;
      color: #cc4444;
      text-align: center;
      padding: 8px 0;
    }

    .raw-link {
      font-size: 11px;
      color: #444;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
    }
    .raw-link:hover { color: #666; }
  </style>
</head>
<body>
  <h1>Claude Usage</h1>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
