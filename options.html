<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Usage — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      padding: 32px;
      max-width: 480px;
    }
    h1 { font-size: 16px; font-weight: 600; color: #ccc; margin-bottom: 24px; }
    h2 { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase;
         letter-spacing: 0.05em; margin-bottom: 12px; }
    .section { margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 13px;
      color: #e8e8e8;
      outline: none;
    }
    input:focus { border-color: #555; }
    .hint { font-size: 11px; color: #555; margin-top: 4px; }
    button {
      background: #2a5caa;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #3370cc; }
    #status { font-size: 13px; margin-top: 12px; color: #22aa44; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Claude Usage — Settings</h1>

  <div class="section">
    <h2>Teleclaude Sync</h2>
    <p style="font-size:12px;color:#666;margin-bottom:14px">
      Push your Claude session credentials to your Teleclaude bot so /usage works from your phone.
    </p>
    <label for="syncUrl">Bot sync URL</label>
    <input type="url" id="syncUrl" placeholder="http://your-server:8081/sync-credentials">
    <div class="hint">Set CREDENTIALS_PORT in .env.agent, e.g. http://your-server:8081/sync-credentials</div>

    <label for="syncToken" style="margin-top:14px">Sync token</label>
    <input type="password" id="syncToken" placeholder="CREDENTIALS_SYNC_TOKEN value from .env.agent">
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
